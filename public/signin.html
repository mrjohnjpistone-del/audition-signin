<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audition Sign-In</title>
<style>
  :root{
    --bg:#f6efe4; --panel:#fffaf2; --panel-2:#f3e9d8; --ink:#241a12; --ink-soft:#6a5c4a;
    --line:#e2d3ba; --gold:#b8862f; --gold-ink:#7a5410; --wine:#7a1f2b; --wine-ink:#5c1620;
    --ok:#2f6b46; --ok-bg:#e4f0e6; --err:#9a2530; --err-bg:#f7e4e2;
    --shadow:0 10px 40px rgba(50,30,10,.14); --radius:16px;
    --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#171310; --panel:#221b15; --panel-2:#2b221a; --ink:#f3e8d8; --ink-soft:#b7a58c;
      --line:#3a2e22; --gold:#e0ad55; --gold-ink:#f0cd8b; --wine:#d98a94; --wine-ink:#eab6bc;
      --ok:#8fd0a3; --ok-bg:#1d2a20; --err:#f0a7a1; --err-bg:#2c1a19;
      --shadow:0 12px 44px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="light"]{
    --bg:#f6efe4; --panel:#fffaf2; --panel-2:#f3e9d8; --ink:#241a12; --ink-soft:#6a5c4a;
    --line:#e2d3ba; --gold:#b8862f; --gold-ink:#7a5410; --wine:#7a1f2b; --wine-ink:#5c1620;
    --ok:#2f6b46; --ok-bg:#e4f0e6; --err:#9a2530; --err-bg:#f7e4e2;
    --shadow:0 10px 40px rgba(50,30,10,.14);
  }
  :root[data-theme="dark"]{
    --bg:#171310; --panel:#221b15; --panel-2:#2b221a; --ink:#f3e8d8; --ink-soft:#b7a58c;
    --line:#3a2e22; --gold:#e0ad55; --gold-ink:#f0cd8b; --wine:#d98a94; --wine-ink:#eab6bc;
    --ok:#8fd0a3; --ok-bg:#1d2a20; --err:#f0a7a1; --err-bg:#2c1a19;
    --shadow:0 12px 44px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    line-height:1.5; -webkit-font-smoothing:antialiased;
    padding:max(16px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px; margin:0 auto}
  header.masthead{text-align:center; padding:22px 0 10px}
  .eyebrow{text-transform:uppercase; letter-spacing:.28em; font-size:11px; color:var(--gold-ink); font-weight:700; margin-bottom:10px}
  h1{font-family:var(--serif); font-weight:700; font-size:clamp(30px,7vw,44px); margin:0; text-wrap:balance; line-height:1.08}
  .subtitle{color:var(--ink-soft); font-family:var(--serif); font-style:italic; font-size:clamp(15px,3.4vw,19px); margin-top:8px}
  .meta{display:flex; flex-direction:column; gap:6px; align-items:center; margin-top:14px; color:var(--ink-soft); font-size:14px}
  .meta span{display:inline-flex; align-items:flex-start; gap:7px; text-align:left; max-width:44ch}
  .rule{height:1px; background:linear-gradient(90deg,transparent,var(--line) 15%,var(--line) 85%,transparent); margin:20px 0}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px}
  .lead{font-family:var(--serif); font-size:20px; font-weight:700; margin:0 0 4px}
  .lead-hint{color:var(--ink-soft); font-size:14px; margin:0 0 18px}
  label.field{display:block; margin-bottom:16px}
  label.field .lab{display:block; font-size:13px; font-weight:600; margin-bottom:6px}
  label.field .req{color:var(--wine)}
  input,textarea,select{width:100%; font:inherit; color:inherit; background:var(--panel-2);
    border:1.5px solid var(--line); border-radius:10px; padding:13px 14px; -webkit-appearance:none; appearance:none}
  select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%237a5410' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position:right 14px center; padding-right:42px; cursor:pointer;
  }
  @media (prefers-color-scheme:dark){ select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23f0cd8b' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");} }
  :root[data-theme="dark"] select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23f0cd8b' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");}
  input:focus,textarea:focus,select:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
  select:disabled{opacity:.6}
  textarea{min-height:78px; resize:vertical}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  @media (max-width:440px){ .two{grid-template-columns:1fr} }
  .contact-hint{color:var(--ink-soft); font-size:13px; margin:-10px 0 16px}
  .btn{appearance:none; cursor:pointer; font:inherit; font-weight:700; border-radius:12px; border:1px solid transparent; padding:15px 20px; width:100%; transition:transform .06s ease, filter .15s}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--wine); color:#fff}
  @media (prefers-color-scheme:dark){ .btn-primary{color:#1a1410} }
  :root[data-theme="dark"] .btn-primary{color:#1a1410}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-primary:disabled{opacity:.55; cursor:not-allowed}
  .btn-ghost{background:transparent; color:var(--ink-soft); border-color:var(--line); font-weight:600}
  .msg{border-radius:10px; padding:12px 14px; margin-bottom:16px; font-size:14px; font-weight:600}
  .msg.err{background:var(--err-bg); color:var(--err)}
  .msg.warn{background:#f4ead2; color:#8a6a1f}
  @media (prefers-color-scheme:dark){ .msg.warn{background:#2c2318; color:#e0b878} }
  :root[data-theme="dark"] .msg.warn{background:#2c2318; color:#e0b878}
  .empty{text-align:center; color:var(--ink-soft); padding:26px 10px}
  .ticket{text-align:center; padding:12px 6px}
  .ticket .stamp{width:64px; height:64px; border-radius:50%; background:var(--ok-bg); color:var(--ok); display:grid; place-items:center; margin:6px auto 14px; font-size:34px}
  .ticket h2{font-family:var(--serif); font-size:28px; margin:0 0 6px}
  .ticket .big{font-family:var(--serif); font-size:25px; font-weight:700; color:var(--wine); margin:14px 0 2px; line-height:1.2}
  .ticket .who{color:var(--ink-soft); margin-bottom:6px}
  .ticket .role{display:inline-block; margin-top:4px; font-size:13px; font-weight:700; color:var(--gold-ink); background:var(--panel-2); border:1px solid var(--line); padding:4px 12px; border-radius:20px}
  .foot{text-align:center; color:var(--ink-soft); font-size:12px; margin-top:16px}
  .spin{display:inline-block; width:16px; height:16px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:sp .7s linear infinite; vertical-align:-3px; margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .spin{animation:none} .btn:active{transform:none} }
  /* section dividers within the form */
  .section-label{font-family:var(--serif); font-size:16px; font-weight:700; color:var(--gold-ink);
    margin:26px 0 4px; padding-top:16px; border-top:1px solid var(--line); display:flex; align-items:baseline; gap:8px}
  .section-label:first-of-type{border-top:none; padding-top:0; margin-top:6px}
  .section-hint{color:var(--ink-soft); font-size:13px; margin:0 0 14px}
  .optional{color:var(--ink-soft); font-weight:400; font-size:12px; font-style:italic}
  /* weekday toggle chips */
  .days{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:12px}
  .day{cursor:pointer; text-align:center; font-size:13px; font-weight:600; padding:11px 4px; border-radius:10px;
    border:1.5px solid var(--line); background:var(--panel-2); color:var(--ink-soft); user-select:none; transition:all .12s}
  .day input{position:absolute; opacity:0; width:0; height:0}
  .day.on{background:var(--wine); color:#fff; border-color:transparent}
  @media (prefers-color-scheme:dark){ .day.on{color:#1a1410} }
  :root[data-theme="dark"] .day.on{color:#1a1410}
  /* checkbox grid (crew roles) */
  .checkgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:6px}
  @media (max-width:440px){ .checkgrid{grid-template-columns:1fr} }
  .check{display:flex; align-items:center; gap:10px; cursor:pointer; padding:11px 12px; border-radius:10px;
    border:1.5px solid var(--line); background:var(--panel-2); font-size:14px; user-select:none; transition:border-color .12s, background .12s}
  .check:has(input:checked){border-color:var(--gold); background:color-mix(in srgb,var(--gold) 12%,var(--panel-2))}
  .check input{width:18px; height:18px; flex:0 0 auto; accent-color:var(--wine); -webkit-appearance:auto; appearance:auto; margin:0}
  .check.full{grid-column:1/-1}
  /* date-conflict adder + chips */
  .dateadd{display:flex; gap:8px; margin-bottom:10px}
  .dateadd input{flex:1 1 auto}
  .dateadd .btn{width:auto; padding:0 18px; flex:0 0 auto}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px}
  .chip{display:inline-flex; align-items:center; gap:8px; background:var(--panel-2); border:1px solid var(--line);
    border-radius:20px; padding:6px 8px 6px 13px; font-size:13px; font-weight:600}
  .chip button{appearance:none; border:none; background:var(--line); color:var(--ink); cursor:pointer;
    width:20px; height:20px; border-radius:50%; font-size:14px; line-height:1; display:grid; place-items:center; padding:0}
  .chip button:hover{background:var(--wine); color:#fff}
  .nonebox{margin:2px 0 14px}
  .subfields{transition:opacity .15s} .subfields.dim{opacity:.4; pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="eyebrow" id="eyebrow">Audition Sign-In</div>
    <h1 id="title">Auditions</h1>
    <div class="subtitle" id="subtitle" hidden></div>
    <div class="meta" id="meta"></div>
  </header>
  <div class="rule"></div>
  <div id="app"><div class="card"><div class="empty">Loading…</div></div></div>
  <div class="foot">Welcome! Please fill this out when you arrive. Your information goes straight to the casting team.</div>
</div>

<script>
"use strict";
const $ = (s,r=document)=>r.querySelector(s);
const app = $("#app");

// Characters in Aaron Sorkin's stage play "A Few Good Men"
const ROLES = [
  "Lt. j.g. Daniel Kaffee",
  "Lt. Cdr. JoAnne Galloway",
  "Lt. Sam Weinberg",
  "Lance Cpl. Harold Dawson",
  "Pfc. Louden Downey",
  "Col. Nathan Jessep",
  "Lt. Jonathan Kendrick",
  "Capt. Matthew Markinson",
  "Lt. Jack Ross",
  "Capt. Isaac Whitaker",
  "Capt. Julius Alexander Randolph (Judge)",
  "Cdr. Walter Stone",
  "Cpl. Jeffrey Howard",
  "Pfc. William Santiago",
  "Ensemble — M.P. / Sailor / Marine",
  "Open to any role",
];

// Behind-the-scenes roles for the "if not cast" multi-select (requirement B)
const CREW = [
  "Wherever I'm needed",
  "Set construction",
  "Set painting / scenic art",
  "Stage crew / running crew",
  "Props",
  "Lighting",
  "Sound",
  "Costumes / wardrobe",
  "Hair & makeup",
  "Usher / front of house",
  "Box office / tickets",
  "Concessions",
  "Publicity / social media",
  "Photography / videography",
  "Stage management",
  "Program / graphic design",
];
const WEEKDAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
// Rehearsal window for the conflict picker (requirement A)
const REH_START = "2026-08-17", REH_END = "2026-11-21";

let DATA = null, submitting = false, mode = "form";
let conflictDates = []; // ISO date strings the auditioner has flagged as conflicts

function esc(t){ return String(t==null?"":t).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function load(){
  try{
    const r = await fetch("/api/public",{cache:"no-store"});
    if(!r.ok) throw new Error();
    DATA = await r.json();
    paintHeader();
    return true;
  }catch(e){
    // The form still works without event details — fall back to defaults.
    if(!DATA) DATA = { event:{} };
    paintHeader();
    return false;
  }
}
function paintHeader(){
  const ev = (DATA && DATA.event) || {};
  $("#title").textContent = ev.title || "Auditions";
  const sub = $("#subtitle");
  if(ev.subtitle){ sub.textContent = ev.subtitle; sub.hidden=false; } else sub.hidden=true;
  const meta = $("#meta"); meta.innerHTML="";
  if(ev.location) meta.insertAdjacentHTML("beforeend",`<span>📍 <span>${esc(ev.location)}</span></span>`);
  if(ev.notes) meta.insertAdjacentHTML("beforeend",`<span>📝 <span>${esc(ev.notes)}</span></span>`);
}

function renderForm(){
  mode="form";
  app.innerHTML = `
    <div class="card">
      <div class="lead">Sign in for your audition</div>
      <div class="lead-hint">Welcome! Tell us a little about you and your availability.</div>
      <div id="formmsg"></div>
      <form id="f" autocomplete="on">
        <label class="field"><span class="lab">Full name <span class="req">*</span></span>
          <input name="name" autocomplete="name" maxlength="120" required></label>
        <div class="two">
          <label class="field"><span class="lab">Email</span>
            <input name="email" type="email" autocomplete="email" maxlength="160" inputmode="email"></label>
          <label class="field"><span class="lab">Phone</span>
            <input name="phone" type="tel" autocomplete="tel" maxlength="40" inputmode="tel"></label>
        </div>
        <div class="contact-hint">Add at least one — email or phone — so we can reach you.</div>
        <label class="field"><span class="lab">Preferred role <span class="req">*</span></span>
          <select name="role" id="role" required>
            <option value="" disabled selected>Select a role…</option>
            ${ROLES.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("")}
          </select></label>
        <label class="field"><span class="lab">Do you have any military experience? <span class="req">*</span></span>
          <select name="military" id="military" required>
            <option value="" disabled selected>Select one…</option>
            <option value="No">No</option>
            <option value="Yes">Yes</option>
          </select></label>
        <label class="field" id="militaryDetailWrap" hidden><span class="lab">If yes, please explain</span>
          <textarea name="military_detail" id="military_detail" maxlength="800" placeholder="Branch, years of service, role, relevant experience…"></textarea></label>

        <div class="section-label">Your experience</div>
        <label class="field"><span class="lab">Are you willing to be in the ensemble? <span class="req">*</span></span>
          <select name="ensemble" id="ensemble" required>
            <option value="" disabled selected>Select one…</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
            <option value="Only role">Only cast me in a named role</option>
          </select></label>
        <label class="field"><span class="lab">Previous stage experience <span class="optional">(optional)</span></span>
          <textarea name="stage_experience" maxlength="1500" placeholder="Shows, roles, companies — a quick rundown is fine."></textarea></label>
        <label class="field"><span class="lab">Previous theatre training / school <span class="optional">(optional)</span></span>
          <textarea name="training" maxlength="1500" placeholder="Classes, workshops, degrees, coaches…"></textarea></label>

        <div class="section-label">Rehearsal availability <span class="req">*</span></div>
        <div class="section-hint">Rehearsals are tentatively weeknight evenings <b>6:30–9:00 PM</b> — either Mon–Thu or Tue–Fri (subject to change). Tell us any conflicts between <b>Aug 17</b> and <b>Nov 21, 2026</b>.</div>
        <label class="check full nonebox"><input type="checkbox" id="noConflicts"> <span>I have <b>no known conflicts</b> in this window</span></label>
        <div class="subfields" id="conflictFields">
          <span class="lab" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Standing weeknight conflicts (a night you can never rehearse)</span>
          <div class="days" id="weekdays">
            ${WEEKDAYS.map(d=>`<label class="day" data-day="${esc(d)}"><input type="checkbox" name="wk" value="${esc(d)}">${esc(d.slice(0,3))}</label>`).join("")}
          </div>
          <span class="lab" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Specific dates you can't make it</span>
          <div class="dateadd">
            <input type="date" id="confDate" min="${REH_START}" max="${REH_END}" value="${REH_START}">
            <button type="button" class="btn btn-ghost" id="addDate">Add date</button>
          </div>
          <div class="chips" id="dateChips"></div>
          <label class="field" style="margin-top:6px"><span class="lab">Anything else about your availability?</span>
            <textarea name="conflict_notes" maxlength="800" placeholder="Vacations, date ranges, work schedule, whether Mon–Thu or Tue–Fri is easier for you…"></textarea></label>
        </div>

        <div class="section-label">If you're not cast <span class="optional">(optional)</span></div>
        <div class="section-hint">Would you help behind the scenes? Pick anything you'd enjoy — choose as many as you like.</div>
        <div class="checkgrid" id="crew">
          ${CREW.map((c,i)=>`<label class="check${i===0?" full":""}"><input type="checkbox" name="crew" value="${esc(c)}"> <span>${esc(c)}</span></label>`).join("")}
        </div>

        <div class="section-label">Emergency contact <span class="optional">(optional)</span></div>
        <div class="two">
          <label class="field"><span class="lab">Contact name</span>
            <input name="emergency_name" maxlength="120" autocomplete="off"></label>
          <label class="field"><span class="lab">Contact phone</span>
            <input name="emergency_phone" type="tel" maxlength="40" inputmode="tel" autocomplete="off"></label>
        </div>

        <div class="section-label">Stay in touch</div>
        <label class="check full" style="margin-bottom:16px"><input type="checkbox" id="mailing" name="mailing_list"> <span>Add me to the mailing list for news &amp; future auditions</span></label>
        <label class="field"><span class="lab">Anything else we should know? <span class="optional">(optional)</span></span>
          <textarea name="notes" maxlength="800" placeholder="Questions, notes for the casting team…"></textarea></label>
        <button class="btn btn-primary" type="submit" id="submit">Sign me in</button>
      </form>
    </div>`;
  $("#f").addEventListener("submit", submit);
  const mil = $("#military");
  if(mil) mil.addEventListener("change", ()=>{
    const wrap = $("#militaryDetailWrap");
    const show = mil.value === "Yes";
    wrap.hidden = !show;
    if(!show) $("#military_detail").value = "";
  });
  wireAvailability();
}

// ── Rehearsal-availability controls (requirement A) ──────────────────────────
function wireAvailability(){
  conflictDates = [];
  renderChips();
  // weekday toggle chips
  $("#weekdays").querySelectorAll(".day").forEach(lbl=>{
    const cb = lbl.querySelector("input");
    cb.addEventListener("change", ()=>{ lbl.classList.toggle("on", cb.checked); if(cb.checked) clearNone(); });
  });
  // add a specific conflict date
  const add = ()=>{
    const v = $("#confDate").value;
    if(!v) return;
    if(v < REH_START || v > REH_END){ flash("Pick a date between Aug 17 and Nov 21, 2026."); return; }
    if(!conflictDates.includes(v)){ conflictDates.push(v); conflictDates.sort(); renderChips(); clearNone(); }
  };
  $("#addDate").addEventListener("click", add);
  $("#confDate").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } });
  // "no conflicts" clears & dims everything else
  const none = $("#noConflicts");
  none.addEventListener("change", ()=>{
    const fields = $("#conflictFields");
    fields.classList.toggle("dim", none.checked);
    if(none.checked){
      conflictDates = []; renderChips();
      $("#weekdays").querySelectorAll("input").forEach(cb=>{ cb.checked=false; cb.closest(".day").classList.remove("on"); });
      const cn = $("[name='conflict_notes']"); if(cn) cn.value="";
    }
  });
}
function clearNone(){ const n=$("#noConflicts"); if(n && n.checked){ n.checked=false; $("#conflictFields").classList.remove("dim"); } }
function renderChips(){
  const box = $("#dateChips"); if(!box) return;
  box.innerHTML = conflictDates.map(d=>{
    const dt = new Date(d+"T00:00:00");
    const lbl = dt.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
    return `<span class="chip">${esc(lbl)}<button type="button" data-d="${esc(d)}" aria-label="Remove">×</button></span>`;
  }).join("");
  box.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    conflictDates = conflictDates.filter(x=>x!==b.dataset.d); renderChips();
  }));
}
function flash(text){
  const msg = $("#formmsg"); if(!msg) return;
  msg.innerHTML = `<div class="msg warn">${esc(text)}</div>`;
  msg.scrollIntoView({behavior:"smooth",block:"nearest"});
}

async function submit(e){
  e.preventDefault();
  if(submitting) return;
  const fd = new FormData(e.target);
  const noConf = !!($("#noConflicts") && $("#noConflicts").checked);
  const weekdays = Array.from(document.querySelectorAll("input[name='wk']:checked")).map(c=>c.value);
  const crew = Array.from(document.querySelectorAll("input[name='crew']:checked")).map(c=>c.value);
  const body = { name:(fd.get("name")||"").trim(), email:(fd.get("email")||"").trim(),
    phone:(fd.get("phone")||"").trim(), role:(fd.get("role")||"").trim(),
    military:(fd.get("military")||"").trim(), military_detail:(fd.get("military_detail")||"").trim(),
    ensemble:(fd.get("ensemble")||"").trim(),
    stage_experience:(fd.get("stage_experience")||"").trim(), training:(fd.get("training")||"").trim(),
    conflict_none:noConf, conflict_weekdays:noConf?[]:weekdays, conflict_dates:noConf?[]:conflictDates.slice(),
    conflict_notes:noConf?"":(fd.get("conflict_notes")||"").trim(),
    crew_interests:crew,
    emergency_name:(fd.get("emergency_name")||"").trim(), emergency_phone:(fd.get("emergency_phone")||"").trim(),
    mailing_list: !!($("#mailing") && $("#mailing").checked),
    notes:(fd.get("notes")||"").trim() };
  const msg = $("#formmsg"); msg.innerHTML="";
  if(!body.name){ msg.innerHTML=`<div class="msg err">Please enter your name.</div>`; return; }
  if(!body.email && !body.phone){ msg.innerHTML=`<div class="msg err">Please add an email or phone number.</div>`; return; }
  if(!body.role){ msg.innerHTML=`<div class="msg err">Please choose a preferred role.</div>`; return; }
  if(!body.military){ msg.innerHTML=`<div class="msg err">Please answer the military experience question.</div>`; return; }
  if(!body.ensemble){ msg.innerHTML=`<div class="msg err">Please tell us whether you're willing to be in the ensemble.</div>`; return; }
  if(!noConf && !weekdays.length && !conflictDates.length && !body.conflict_notes){
    msg.innerHTML=`<div class="msg err">Please list any rehearsal conflicts — or check "I have no known conflicts."</div>`; return; }
  submitting=true;
  const btn = $("#submit"); btn.disabled=true; btn.innerHTML=`<span class="spin"></span>Signing you in…`;
  try{
    const r = await fetch("/api/checkin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j = await r.json().catch(()=>({}));
    if(!r.ok){
      submitting=false;
      msg.innerHTML=`<div class="msg err">${esc(j.error||"Something went wrong. Please try again.")}</div>`;
      btn.disabled=false; btn.innerHTML="Sign me in";
      return;
    }
    ticket(body, j);
  }catch(err){
    submitting=false;
    msg.innerHTML=`<div class="msg err">Network problem — check your connection and try again.</div>`;
    btn.disabled=false; btn.innerHTML="Sign me in";
  }
}

function ticket(body,j){
  submitting=false; mode="ticket";
  app.innerHTML = `
    <div class="card ticket">
      <div class="stamp">✓</div>
      <h2>You're signed in</h2>
      <div class="big">${esc(body.name)}</div>
      ${body.role?`<div><span class="role">Reading for: ${esc(body.role)}</span></div>`:""}
      <div class="lead-hint" style="margin:18px 0 0">Thanks! Have a seat — the casting team has your information. Break a leg!</div>
      <button class="btn btn-primary" id="again" style="margin-top:18px">Sign in the next person</button>
    </div>`;
  $("#again").addEventListener("click",()=>{ renderForm(); window.scrollTo({top:0,behavior:"smooth"}); });
}

// Load event details once (form works even if this fails), then render.
load().then(renderForm);
</script>
</body>
